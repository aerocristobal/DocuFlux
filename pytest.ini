[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --cov=web --cov=worker --cov=shared --cov=config --cov=scripts --cov-report=term-missing --cov-report=json:coverage.json --cov-config=.coveragerc
pythonpath = . web worker shared
# Scenario paths in tests/bdd/ resolve under this, so tests/features/epic*/
# (the inert kanban export) is unreachable even by accident.
bdd_features_base_dir = tests/features/capabilities

markers =
    # --- test tier (applied automatically by directory, see tests/conftest.py) ---
    unit: fast, fully-mocked tests of a single module
    integration: multi-component tests through the Flask test client
    ui: backend contract tests for the web UI (not browser-driven)
    bdd: generated from a Gherkin scenario under tests/features/capabilities
    characterization: pins current behaviour of legacy code; change only deliberately
    # --- cross-cutting ---
    provisional: pins behaviour that is known-incomplete; see the comment on the test
    packaging: static checks over Dockerfiles and requirements files
    slow: takes more than one second
    docker: requires a running container; deselected in CI with -m "not docker"
    smoke: minimal high-signal subset
    # --- capability (mirrors tests/features/capabilities/ and the Gherkin tags) ---
    conversion: capability - document conversion
    capture: capability - browser-extension capture
    api_v1: capability - REST API v1
    auth: capability - API keys and admin endpoints
    storage: capability - storage, retention and cleanup
    security: capability - security controls
    reliability: capability - failure handling and health
    # --- acceptance priority (Gherkin tags) ---
    p0: acceptance priority P0
    p1: acceptance priority P1
    p2: acceptance priority P2
