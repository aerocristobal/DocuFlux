# GPU Profile Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Or: docker-compose --profile gpu up (if profiles added to main compose file)

services:
  worker:
    image: worker:gpu
    build:
      context: ./worker
      dockerfile: Dockerfile
      args:
        BUILD_GPU: "true"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_METADATA_URL=redis://redis:6379/1
      - MARKER_ENABLED=true
      - BUILD_GPU=true
      - SURYA_INFERENCE_AUTOSTART=false
      # The /v1 suffix is load-bearing: surya uses this value verbatim as the
      # OpenAI base_url and derives the health probe by stripping a trailing
      # /v1. Without it, /health still answers 200 so the worker looks healthy,
      # but every inference POST lands on /chat/completions (404) and Marker
      # silently emits an empty page — no text, no images, no ZIP.
      - SURYA_INFERENCE_URL=http://surya-vlm:8000/v1
    command: celery -A tasks worker --loglevel=info --pool=solo --without-mingle --without-gossip -Q gpu,default,high_priority
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 18G  # 16GB VRAM + 2GB system (Epic 21.4)
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

  # Canonical definition lives in docker-compose.yml (the base deployment IS the
  # GPU topology). This override keeps the same image/env/probes so overlay-only
  # runs behave identically, and adds the gpu profile like worker/beat above.
  surya-vlm:
    image: vllm/vllm-openai:v0.20.1
    environment:
      - VLLM_GPU_MEMORY_UTILIZATION=0.85
      - SURYA_MODEL=datalab-to/surya-ocr-2
    command: sh -c "python -m vllm.entrypoints.api_server --model $$SURYA_MODEL --host 0.0.0.0 --port 8000"
    expose:
      - "8000"  # internal only — workers reach it at http://surya-vlm:8000
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 24G  # 24GB baseline at VLLM_GPU_MEMORY_UTILIZATION=0.85 (Epic 21.10)
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # vLLM /health returns 503 until the model is loaded, then 200.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # surya-ocr-2 model load can take minutes on first start
    profiles:
      - gpu

  beat:
    profiles:
      - gpu
