services:
  redis:
    image: redis:7-alpine
    # Epic 24.1: Redis TLS Configuration - TEMPORARILY DISABLED (certificates not generated)
    # TODO: Re-enable TLS after generating certificates per Epic 24 instructions
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --port 6379
      --requirepass ${REDIS_PASSWORD}
    # Epic 24.3: No port exposure - Redis only accessible from Docker internal network
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    volumes:
      - ./data:/app/data
      - ./deploy/certs:/certs:ro  # Epic 24.1: Mount certificates for TLS
    ports:
      - "5000:5000"
    environment:
      # Epic 24.1: Redis URLs (TLS disabled - using redis:// instead of rediss://)
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_METADATA_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      # Epic 24.1: Redis TLS certificates (DISABLED - certificates not generated)
      # - REDIS_TLS_CA_CERTS=/certs/redis/ca.crt
      # - REDIS_TLS_CERTFILE=/certs/redis/redis.crt
      # - REDIS_TLS_KEYFILE=/certs/redis/redis.key
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_API_SECRET=${ADMIN_API_SECRET:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - BEHIND_PROXY=${BEHIND_PROXY:-false}
      # Epic 5: Storage backend (default: local filesystem)
      # Set STORAGE_BACKEND=s3 to use S3-compatible storage
      # - STORAGE_BACKEND=s3
      # - S3_BUCKET=docuflux-storage
      # - S3_ENDPOINT_URL=https://s3.amazonaws.com
      # - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      # - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      # - S3_REGION=us-east-1
      # - S3_SSE_ALGORITHM=AES256
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # Epic 21.8: Container security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=200m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - ./data:/app/data
      - ./deploy/certs:/certs:ro  # Epic 24.1: Mount certificates for TLS

    # To expose metrics on localhost for debugging: ports: ["9090:9090"]
    expose:
      - "9090"  # Prometheus metrics — internal network only
    environment:
      # Epic 24.1: Redis URLs (TLS disabled - using redis:// instead of rediss://)
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_METADATA_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      # Epic 24.1: Redis TLS certificates (DISABLED - certificates not generated)
      # - REDIS_TLS_CA_CERTS=/certs/redis/ca.crt
      # - REDIS_TLS_CERTFILE=/certs/redis/redis.crt
      # - REDIS_TLS_KEYFILE=/certs/redis/redis.key
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - MCP_SECRET=${MCP_SECRET}
      # Marker v2: the worker is a thin client that sends OCR/layout work to the
      # shared Surya VLM inference server (surya-vlm service below). AUTOSTART=false
      # because the deployment owns the server — the worker must not spawn its own.
      # Matches docker-compose.gpu.yml and deploy/k8s/worker.yaml.
      # The /v1 suffix is load-bearing: surya uses this value verbatim as the
      # OpenAI base_url and derives the health probe by stripping a trailing
      # /v1. Without it, /health still answers 200 so the worker looks healthy,
      # but every inference POST lands on /chat/completions (404) and Marker
      # silently emits an empty page — no text, no images, no ZIP.
      - SURYA_INFERENCE_URL=http://surya-vlm:8000/v1
      - SURYA_INFERENCE_AUTOSTART=false
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      # Epic 5: Storage backend (default: local filesystem)
      # - STORAGE_BACKEND=s3
      # - S3_BUCKET=docuflux-storage
      # - S3_ENDPOINT_URL=https://s3.amazonaws.com
      # - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      # - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      # - S3_REGION=us-east-1
      # - S3_SSE_ALGORITHM=AES256
    # Story 6.3: heavy lane is GPU-queue only now. A 10-minute Marker job no
    # longer sits ahead of Pandoc/metadata/maintenance tasks queued behind
    # it — those go to worker-light below, a separate process/queue.
    # GPU exclusivity preserved: concurrency stays 1 for this lane.
    command: >
      celery -A tasks worker
      --loglevel=info
      --pool=solo
      --without-mingle
      --without-gossip
      --concurrency=1
      -Q gpu
    depends_on:
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started

    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Epic 21.8: Container security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=3g  # Increased for Marker model downloads
    # Story 3.2: Probe Celery itself, not the MCP server. A dead Celery worker
    # now flips the container to unhealthy so the orchestrator restarts it, and
    # the check no longer depends on the MCP endpoint being reachable.
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks inspect ping -d celery@$${HOSTNAME} -t 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Shared Surya VLM inference server (Marker v2).
  #
  # marker-pdf 2.0.0 is a thin client: the OCR/layout weights live in THIS
  # process, not the worker's. The base deployment is the GPU topology (the
  # worker above reserves an NVIDIA device and drains the `gpu` queue), so the
  # server lives here unprofiled — plain `docker compose up` must start it or
  # the GPU worker has no inference server to attach to. docker-compose.cpu.yml
  # gates it out of CPU-only deployments; the k8s twin is deploy/k8s/surya-vlm.yaml.
  #
  # Recycling decision (benchmarks/marker_v2/REPORT.md): the worker recycles
  # itself every 50 tasks (max_tasks_per_child=50 in worker/tasks/__init__.py),
  # but that only bounds worker-process memory — this server is a separate
  # long-lived process, and state can accumulate in the shared vLLM server over
  # a long run (the observed degeneration was on the 10th document of a
  # sequential batch). Decision: recycle THIS server on a bounded deployment
  # schedule, never from the worker (workers must not tear down the shared
  # server between jobs — tests/unit/test_worker.py pins that). Operators
  # restart it periodically (`docker compose restart surya-vlm`, or a
  # cron/systemd timer), and the restart policy below brings it back on crash.
  # See "Inference server recycling" in docs/ARCHITECTURE.md.
  surya-vlm:
    image: vllm/vllm-openai:v0.20.1
    environment:
      - VLLM_GPU_MEMORY_UTILIZATION=0.85
      - SURYA_MODEL=datalab-to/surya-ocr-2
    # The vllm/vllm-openai image's ENTRYPOINT is already `vllm serve`, so a bare
    # `command:` is appended as ARGUMENTS to it — the shell form was being parsed
    # as a model tag plus flags and died on `--compilation-config`. Override the
    # entrypoint with a shell so SURYA_MODEL/VLLM_GPU_MEMORY_UTILIZATION above
    # stay the single place the model and memory budget are set.
    entrypoint: ["/bin/sh", "-c"]
    # Single list element: a string `command` gets shell-split by Compose, which
    # would hand `sh -c` only the first word as its script.
    command:
      - >
        vllm serve "$$SURYA_MODEL"
        --host 0.0.0.0 --port 8000
        --gpu-memory-utilization "$$VLLM_GPU_MEMORY_UTILIZATION"
    expose:
      - "8000"  # internal only — workers reach it at http://surya-vlm:8000
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 24G  # 24GB baseline at VLLM_GPU_MEMORY_UTILIZATION=0.85 (Epic 21.10)
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Epic 21.8: Container security hardening (mirrors the rest of the stack)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # vLLM /health returns 503 until the model is loaded, then 200.
      # python3, not python — the vllm image ships no `python` on PATH, so the
      # probe failed to exec and the container never left "health: starting".
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # surya-ocr-2 model load can take minutes on first start
    restart: unless-stopped

  # Story 6.3: light lane — Pandoc, OCR, metadata, and maintenance tasks run
  # here, on a separate process from the GPU/Marker worker above, so a long
  # Marker job never blocks them. No GPU reservation; cheap to run/restart.
  worker-light:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        BUILD_GPU: "false"
    volumes:
      - ./data:/app/data
      - ./deploy/certs:/certs:ro  # Epic 24.1: Mount certificates for TLS
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_METADATA_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - MCP_SECRET=${MCP_SECRET}
      - BUILD_GPU=false
      - MARKER_ENABLED=false
    command: >
      celery -A tasks worker
      --loglevel=info
      --pool=solo
      --without-mingle
      --without-gossip
      --concurrency=1
      -Q high_priority,default
    depends_on:
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=1g
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks inspect ping -d celery@$${HOSTNAME} -t 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # --schedule puts the shelve DB inside the beat-data volume below. Without
    # it beat writes celerybeat-schedule.db into its CWD (/app), which is not a
    # volume, so last-run times were lost on every recreate and periodic tasks
    # all re-fired on startup. Celery appends the .db suffix itself.
    command: celery -A tasks beat --loglevel=info --schedule /app/celerybeat/celerybeat-schedule
    volumes:
      - ./data:/app/data
      - beat-data:/app/celerybeat
      - ./deploy/certs:/certs:ro  # Epic 24.1: Mount certificates for TLS

    environment:
      # Epic 24.1: Redis URLs (TLS disabled - using redis:// instead of rediss://)
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_METADATA_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      # Epic 24.1: Redis TLS certificates (DISABLED - certificates not generated)
      # - REDIS_TLS_CA_CERTS=/certs/redis/ca.crt
      # - REDIS_TLS_CERTFILE=/certs/redis/redis.crt
      # - REDIS_TLS_KEYFILE=/certs/redis/redis.key
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    # beat is built from worker/Dockerfile, whose HEALTHCHECK pings a Celery
    # *worker* over the broker. Beat is a scheduler, never answers that ping,
    # and so reported unhealthy while scheduling tasks perfectly well. Probe the
    # scheduler process itself instead.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery -A tasks beat' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mcp-server:
    build: ./mcp_server
    # Port not exposed to host — only accessible from Docker internal network
    expose:
      - "8080"
    environment:
      - PORT=8080
      - MCP_SECRET=${MCP_SECRET}
      - MCP_ALLOWED_DOMAINS=${MCP_ALLOWED_DOMAINS:-read.amazon.com,percipio.com}
    deploy:
      resources:
        limits:
          memory: 1024M # Playwright can be memory intensive
        # For GPU-enabled browser if needed, add GPU reservations here
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: 1
        #       capabilities: [gpu]
    restart: unless-stopped
    # This service doesn't strictly depend on Redis, but worker will depend on it

# Epic 21.7: Docker Swarm Secrets (optional)
# To use Docker secrets instead of environment variables:
# 1. Create secrets:
#    echo "your-secret-key-here" | docker secret create secret_key -
#    echo "your-tunnel-token" | docker secret create cloudflare_tunnel_token -
# 2. Add to services:
#    secrets:
#      - secret_key
#      - cloudflare_tunnel_token
# 3. Secrets are available at /run/secrets/secret_key, etc.
# 4. The secrets module automatically loads from /run/secrets/ first
#
# secrets:
#   secret_key:
#     external: true
#   cloudflare_tunnel_token:
#     external: true

volumes:
  redis-data:
  beat-data:
