openapi: 3.0.0
info:
  title: DocuFlux API
  description: |
    API for DocuFlux, a containerized document conversion service combining Pandoc
    (universal converter) with Marker AI (deep-learning PDF processor) and local
    SLM metadata extraction.

    ## Authentication
    All `/api/v1/` endpoints (except `/api/v1/formats` and `/api/v1/status`) require
    an API key passed via the `X-API-Key` header.

    Generate a key with `POST /api/v1/auth/keys`.

    Admin endpoints (`/api/v1/auth/keys`, `/api/v1/admin/*` writes) use
    `Authorization: Bearer <ADMIN_API_SECRET>` (`AdminAuth`).

    ## OCR mode
    Marker-backed conversions return `409` when the OCR mode is `cpu_only`;
    in `on_demand` mode they request a Surya VLM load (see `/api/v1/admin/surya`).

    ## Rate limits
    - Conversion: 200 requests / hour
    - Key creation: 10 requests / hour
    - Global: 1000 / day, 200 / hour per IP
  version: 1.4.0
  contact:
    url: https://github.com/aerocristobal/DocuFlux

servers:
  - url: http://localhost:5000
    description: Local development server

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminAuth:
      type: http
      scheme: bearer
      description: ADMIN_API_SECRET

  parameters:
    JobIdPath:
      in: path
      name: job_id
      required: true
      schema:
        $ref: '#/components/schemas/JobId'
      description: UUID of the job
    SessionIdPath:
      in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the capture session

  schemas:
    JobId:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    JobStatus:
      type: string
      enum: [pending, processing, success, failure, revoked, capturing, completed-with-warnings]
      description: |
        `completed-with-warnings` (Story 1.3): a successfully-converted job
        whose output scored `poor` on the quality report — surfaced
        distinctly so degraded output is never reported as silent plain
        success. The underlying job is otherwise complete; `download_url`
        is still present.

    QualityReport:
      type: object
      description: |
        Deterministic quality assessment of the converted Markdown (Story
        1.1/1.2/1.3): word density, heading structure, table
        well-formedness, garbage-character ratio, and empty-page ratio.
        Present whenever the output format is Markdown/GFM and the engine
        ran the scorer (Pandoc, hybrid's accepted Pandoc path, and OCR).
      properties:
        grade:
          type: string
          enum: [good, fair, poor]
        score:
          type: integer
          minimum: 0
          maximum: 100
        reasons:
          type: array
          items:
            type: string
          example: [low_word_density, no_headings]
        metrics:
          type: object
          description: Per-dimension raw values the grade/score were computed from.
          properties:
            total_words: {type: number}
            page_count: {type: number}
            words_per_page: {type: number}
            garbage_ratio: {type: number}
            has_headings: {type: number}
            malformed_tables: {type: number}
            empty_page_ratio: {type: number}

    SlmMetadata:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, PROCESSING, SUCCESS, FAILURE, SKIPPED]
        title:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string

    OcrSettings:
      type: object
      properties:
        mode: {type: string, enum: [cpu_only, on_demand]}
        idle_timeout_min: {type: integer, minimum: 1}

    SuryaSnapshot:
      type: object
      properties:
        state: {type: string, enum: [stopped, starting, running, stopping, error]}
        desired: {type: string, enum: [running, stopped]}
        pinned: {type: boolean, description: True after a manual load; exempt from idle unload}
        surya_supported: {type: boolean, description: GPU with >= 16 GB VRAM present}
        mode: {type: string, enum: [cpu_only, on_demand]}
        idle_timeout_min: {type: integer}

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Job not found"

paths:

  # ─────────────────────────────────────────────────────────
  # Web UI endpoints (session-based, no API key)
  # ─────────────────────────────────────────────────────────

  /convert:
    post:
      summary: Submit conversion (Web UI)
      description: Uploads a file and queues a conversion task. Session-based, no API key required.
      security: []
      tags: [Web UI]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, from_format, to_format]
              properties:
                file:
                  type: string
                  format: binary
                  description: Document to convert (max 100 MB)
                from_format:
                  type: string
                  example: markdown
                to_format:
                  type: string
                  example: html
      responses:
        '200':
          description: Job(s) queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_ids:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobId'
                  status:
                    type: string
                    example: queued
        '400':
          description: Missing file or invalid format
        '413':
          description: File exceeds 100 MB
        '507':
          description: Server disk full

  /api/jobs:
    get:
      summary: List session jobs (Web UI)
      security: []
      tags: [Web UI]
      responses:
        '200':
          description: Jobs for current session
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/JobId'
                    filename:
                      type: string
                    from:
                      type: string
                    to:
                      type: string
                    created_at:
                      type: number
                      description: Unix timestamp
                    status:
                      $ref: '#/components/schemas/JobStatus'
                    progress:
                      type: integer
                      minimum: 0
                      maximum: 100
                    result:
                      type: string
                      nullable: true
                    download_url:
                      type: string
                      nullable: true
                    is_zip:
                      type: boolean
                    file_count:
                      type: integer
                    slm:
                      $ref: '#/components/schemas/SlmMetadata'
                      nullable: true

  /api/cancel/{job_id}:
    post:
      summary: Cancel a running job
      security: []
      tags: [Web UI]
      parameters:
        - {$ref: '#/components/parameters/JobIdPath'}
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: cancelled}
        '400': {description: Invalid job ID}

  /api/retry/{job_id}:
    post:
      summary: Retry a failed job
      security: []
      tags: [Web UI]
      parameters:
        - {$ref: '#/components/parameters/JobIdPath'}
      responses:
        '200':
          description: New job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: retried}
                  new_job_id: {$ref: '#/components/schemas/JobId'}
        '400': {description: Input file expired or invalid ID}
        '404': {description: Job not found}

  /api/delete/{job_id}:
    post:
      summary: Delete a job and its files
      security: []
      tags: [Web UI]
      parameters:
        - {$ref: '#/components/parameters/JobIdPath'}
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: deleted}
        '400': {description: Invalid job ID}
        '404': {description: Job not found}

  /download/{job_id}:
    get:
      summary: Download converted file
      security: []
      tags: [Web UI]
      parameters:
        - {$ref: '#/components/parameters/JobIdPath'}
      responses:
        '200':
          description: File binary
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {description: Invalid job ID}
        '404': {description: File not found or expired}

  /download_zip/{job_id}:
    get:
      summary: Download multi-file output as ZIP
      description: Returns a ZIP archive for Marker jobs that produce markdown + images.
      security: []
      tags: [Web UI]
      parameters:
        - {$ref: '#/components/parameters/JobIdPath'}
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema: {type: string, format: binary}
        '400': {description: Invalid job ID}
        '404': {description: Output not found}

  /api/status/services:
    get:
      summary: Service health summary
      security: []
      tags: [Web UI]
      responses:
        '200':
          description: Health of dependent services
          content:
            application/json:
              schema:
                type: object
                properties:
                  disk_space: {type: string, enum: [ok, low]}
                  marker: {type: string}
                  marker_status: {type: string}
                  models_cached: {type: boolean}
                  gpu_status: {type: string, enum: [available, unavailable, initializing]}
                  gpu_info:
                    type: object
                    additionalProperties: true
                  surya_state:
                    type: string
                    enum: [stopped, starting, running, stopping, error]
                    description: Observed state of the on-demand Surya VLM server
                  ocr_mode: {type: string, enum: [cpu_only, on_demand]}
                  idle_timeout_min: {type: integer, description: Minutes idle before Surya is unloaded}
                  surya_supported:
                    type: boolean
                    description: True when a GPU with enough VRAM for Surya is present

  /healthz:
    get:
      summary: Liveness probe
      security: []
      tags: [Health]
      responses:
        '200': {description: Always OK}

  /readyz:
    get:
      summary: Readiness probe
      description: Returns 503 if Redis is unreachable.
      security: []
      tags: [Health]
      responses:
        '200': {description: Ready}
        '503': {description: Not ready — Redis down}

  # ─────────────────────────────────────────────────────────
  # REST API v1 (API key required)
  # ─────────────────────────────────────────────────────────

  /api/v1/convert:
    post:
      summary: Submit conversion job
      description: |
        Queues a document conversion. Returns `202 Accepted` immediately; poll
        `/api/v1/status/{job_id}` for progress.
      tags: [Conversions]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, to_format]
              properties:
                file:
                  type: string
                  format: binary
                  description: Document to convert (max 100 MB)
                to_format:
                  type: string
                  description: Output format key (e.g. `html`, `pdf`, `markdown`)
                  example: markdown
                from_format:
                  type: string
                  description: Input format key. Auto-detected from file extension if omitted.
                  example: pdf
                engine:
                  type: string
                  enum: [pandoc, marker]
                  default: pandoc
                  description: Conversion engine. Use `marker` for high-accuracy PDF→Markdown.
                force_ocr:
                  type: boolean
                  default: false
                  description: Force OCR on every page (Marker only)
                use_llm:
                  type: boolean
                  default: false
                  description: Use LLM post-processing (Marker only)
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {$ref: '#/components/schemas/JobId'}
                  status: {type: string, example: queued}
                  status_url: {type: string, example: /api/v1/status/3fa85f64-...}
                  created_at: {type: string, format: date-time}
        '400': {description: Missing file or to_format}
        '401': {description: Missing or invalid API key}
        '409': {description: "OCR mode is cpu_only: AI (Marker) engine disabled"}
        '422': {description: Unsupported format or engine}
        '507': {description: Server disk full}

  /api/v1/status/{job_id}:
    get:
      summary: Get job status
      description: Poll until `status` is `success` or `failure`.
      tags: [Conversions]
      security: []
      parameters:
        - {$ref: '#/components/parameters/JobIdPath'}
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {$ref: '#/components/schemas/JobId'}
                  status: {$ref: '#/components/schemas/JobStatus'}
                  filename: {type: string}
                  from: {type: string}
                  to: {type: string}
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                  created_at: {type: string, format: date-time}
                  started_at: {type: string, format: date-time, nullable: true}
                  completed_at: {type: string, format: date-time, nullable: true}
                  download_url: {type: string, nullable: true}
                  is_multifile: {type: boolean}
                  file_count: {type: integer}
                  error: {type: string, nullable: true}
                  quality:
                    $ref: '#/components/schemas/QualityReport'
                    nullable: true
                  slm_metadata:
                    $ref: '#/components/schemas/SlmMetadata'
                    nullable: true
        '400': {description: Invalid job ID format}
        '404': {description: Job not found}

  /api/v1/download/{job_id}:
    get:
      summary: Download converted output
      description: |
        Returns the converted file. If the job produced multiple files
        (e.g. Marker PDF with images), returns a ZIP archive.
      tags: [Conversions]
      parameters:
        - {$ref: '#/components/parameters/JobIdPath'}
      responses:
        '200':
          description: File or ZIP
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            application/zip:
              schema: {type: string, format: binary}
        '400': {description: Invalid job ID}
        '404': {description: Output not found or expired}

  /api/v1/formats:
    get:
      summary: List supported formats
      security: []
      tags: [Conversions]
      responses:
        '200':
          description: Supported input/output formats and common conversions
          content:
            application/json:
              schema:
                type: object
                properties:
                  input_formats:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        key: {type: string}
                        extension: {type: string}
                        mime_types:
                          type: array
                          items: {type: string}
                        supports_marker: {type: boolean}
                        supports_pandoc: {type: boolean}
                  output_formats:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        key: {type: string}
                        extension: {type: string}
                  conversions:
                    type: array
                    items:
                      type: object
                      properties:
                        from: {type: string}
                        to: {type: string}
                        engines:
                          type: array
                          items: {type: string}
                        recommended_engine: {type: string}

  # ─── SLM Metadata ───────────────────────────────────────

  /api/v1/jobs/{job_id}/extract-metadata:
    post:
      summary: Trigger SLM metadata extraction
      description: |
        Manually queue SLM (TinyLlama) metadata extraction for a completed job.
        The job must have a Markdown output file. Extraction runs asynchronously;
        poll `/api/v1/status/{job_id}` for `slm_metadata.status`.

        SLM also runs automatically after every successful Marker conversion.
      tags: [SLM Metadata]
      parameters:
        - {$ref: '#/components/parameters/JobIdPath'}
      responses:
        '202':
          description: Extraction queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {$ref: '#/components/schemas/JobId'}
                  status: {type: string, example: queued}
                  message: {type: string}
        '400': {description: Invalid job ID}
        '401': {description: Missing or invalid API key}
        '404': {description: Job not found or no markdown output}
        '409': {description: Job not in SUCCESS state}

  # ─── Auth ───────────────────────────────────────────────

  /api/v1/auth/keys:
    post:
      summary: Create API key
      description: |
        Generates a new API key. The key is returned only once — store it securely.
        Requires the admin secret (`Authorization: Bearer <ADMIN_API_SECRET>`).
      security:
        - AdminAuth: []
      tags: [Authentication]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 100
                  example: My CI integration
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    example: dk_abc123...
                  created_at: {type: string}
                  label: {type: string}
        '401': {description: Missing admin authentication}
        '403': {description: Invalid admin secret}
        '429': {description: Rate limit exceeded (10/hour)}
        '503': {description: Admin API disabled (ADMIN_API_SECRET not configured)}

  /api/v1/auth/keys/{key}:
    delete:
      summary: Revoke API key
      description: Requires the admin secret. Rate limit 30/hour.
      security:
        - AdminAuth: []
      tags: [Authentication]
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string}
          description: The API key to revoke
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: {type: boolean, example: true}
        '401': {description: Missing admin authentication}
        '403': {description: Invalid admin secret}
        '404': {description: Key not found}

  # ─── Webhooks ───────────────────────────────────────────

  /api/v1/webhooks:
    post:
      summary: Register job webhook
      description: |
        Register a URL to receive a POST notification when the job reaches
        `SUCCESS` or `FAILURE`. The payload mirrors the `/api/v1/status` response.
        Rate limit 60/hour.
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id, webhook_url]
              properties:
                job_id:
                  $ref: '#/components/schemas/JobId'
                webhook_url:
                  type: string
                  format: uri
                  example: https://hooks.example.com/docuflux
      responses:
        '201':
          description: Webhook registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {$ref: '#/components/schemas/JobId'}
                  webhook_url: {type: string}
                  registered: {type: boolean}
        '400': {description: Invalid job_id or webhook_url}
        '404': {description: Job not found}

  /api/v1/webhooks/{job_id}:
    get:
      summary: Get registered webhook
      tags: [Webhooks]
      parameters:
        - {$ref: '#/components/parameters/JobIdPath'}
      responses:
        '200':
          description: Registered webhook URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {$ref: '#/components/schemas/JobId'}
                  webhook_url: {type: string}
        '400': {description: Invalid job ID}
        '404': {description: Job not found or no webhook registered}

  # ─── Browser Extension Capture ─────────────────────────

  /api/v1/capture/sessions:
    post:
      summary: Create capture session
      description: |
        Opens a new streaming capture session. The browser extension submits
        pages in batches; call `/finish` when all pages have been sent.
      security: []
      tags: [Capture]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: My Book
                to_format:
                  type: string
                  default: markdown
                source_url:
                  type: string
                  format: uri
                force_ocr:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  job_id:
                    $ref: '#/components/schemas/JobId'
                  status: {type: string, example: active}
                  max_pages: {type: integer}
        '400': {description: Invalid to_format}

  /api/v1/capture/sessions/{session_id}/pages:
    post:
      summary: Submit captured pages
      description: Submit one or more page images (base64 PNG) to the session.
      security: []
      tags: [Capture]
      parameters:
        - {$ref: '#/components/parameters/SessionIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pages]
              properties:
                pages:
                  type: array
                  items:
                    type: object
                    required: [page_number, image_data]
                    properties:
                      page_number: {type: integer}
                      image_data:
                        type: string
                        description: Base64-encoded PNG screenshot
      responses:
        '202':
          description: Pages queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  pages_received: {type: integer}
                  batch_id: {type: string}
        '400': {description: Invalid session ID or missing pages}
        '404': {description: Session not found or expired}
        '409': {description: Session already finished}

  /api/v1/capture/sessions/{session_id}/images:
    post:
      summary: Upload capture image
      description: Upload a large image separately from a page submission. Rate limit 2000/hour.
      security: []
      tags: [Capture]
      parameters:
        - {$ref: '#/components/parameters/SessionIdPath'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary}
                alt: {type: string}
                is_screenshot: {type: boolean, default: false}
      responses:
        '200':
          description: Image stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_ref: {type: string, example: images/0123456789abcdef.png}
                  status: {type: string, example: uploaded}
        '400': {description: No image provided or invalid path}
        '404': {description: Session not found or expired}
        '409': {description: Session is not active}

  /api/v1/capture/sessions/{session_id}/finish:
    post:
      summary: Finish capture session
      description: |
        Signals that all pages have been submitted. Triggers the final
        assembly and conversion job. The job_id returned can be polled
        via `/api/v1/status/{job_id}`.
      security: []
      tags: [Capture]
      parameters:
        - {$ref: '#/components/parameters/SessionIdPath'}
      responses:
        '200':
          description: Session finished, conversion queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  job_id: {$ref: '#/components/schemas/JobId'}
                  status: {type: string, example: finishing}
                  total_pages: {type: integer}
        '400': {description: Invalid session ID}
        '404': {description: Session not found or expired}
        '409': {description: Session already finished}

  /api/v1/capture/sessions/{session_id}/status:
    get:
      summary: Get capture session status
      security: []
      tags: [Capture]
      parameters:
        - {$ref: '#/components/parameters/SessionIdPath'}
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  status: {type: string, enum: [active, finishing, done, expired]}
                  job_id: {$ref: '#/components/schemas/JobId'}
                  page_count: {type: integer}
                  batches_queued: {type: integer}
                  batches_done: {type: integer}
                  batches_failed: {type: integer}
        '400': {description: Invalid session ID}
        '404': {description: Session not found}

  # ─── Admin (ADMIN_API_SECRET) ───────────────────────────

  /api/v1/admin/dlq:
    get:
      summary: Dead letter queue contents
      description: Requires the admin secret. Rate limit 30/hour.
      security:
        - AdminAuth: []
      tags: [Admin]
      parameters:
        - {in: query, name: limit, schema: {type: integer, default: 100, minimum: 1, maximum: 1000}}
      responses:
        '200':
          description: DLQ entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: {type: integer}
                  total: {type: integer}
                  entries: {type: array, items: {type: object, additionalProperties: true}}
        '401': {description: Missing admin authentication}
        '403': {description: Invalid admin secret}
        '503': {description: Admin API disabled}

  /api/v1/admin/captures:
    get:
      summary: Global capture index (all clients)
      description: Requires the admin secret. Rate limit 30/hour.
      security:
        - AdminAuth: []
      tags: [Admin]
      parameters:
        - {in: query, name: limit, schema: {type: integer, default: 50, minimum: 1, maximum: 1000}}
      responses:
        '200':
          description: Capture jobs
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
        '401': {description: Missing admin authentication}
        '403': {description: Invalid admin secret}
        '503': {description: Admin API disabled}

  /api/v1/admin/surya:
    get:
      summary: Surya VLM lifecycle state
      description: Read-only; no admin secret required. Rate limit 60/minute.
      security: []
      tags: [Admin]
      responses:
        '200':
          description: Current lifecycle snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuryaSnapshot'
        '429': {description: Rate limit exceeded}
    post:
      summary: Load or unload the Surya VLM
      description: |
        `load` sets the desired state to `running` and pins Surya (a pinned
        instance is exempt from idle unload). `unload` sets the desired state
        to `stopped` and clears the pin. The lifecycle controller applies the
        change asynchronously and a `surya_state_update` Socket.IO event is
        emitted. Rate limit 30/minute.
      security:
        - AdminAuth: []
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [load, unload]}
      responses:
        '202':
          description: Change accepted; snapshot returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuryaSnapshot'
        '400': {description: "action must be 'load' or 'unload'"}
        '401': {description: Missing or malformed Authorization header}
        '403': {description: Invalid admin secret}
        '409': {description: "Load refused: no GPU with enough VRAM, or OCR mode is cpu_only"}
        '429': {description: Rate limit exceeded}
        '503': {description: Admin API disabled (ADMIN_API_SECRET not configured)}

  /api/v1/admin/ocr-settings:
    get:
      summary: OCR settings
      description: Read-only; no admin secret required. Rate limit 60/minute.
      security: []
      tags: [Admin]
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrSettings'
        '429': {description: Rate limit exceeded}
    put:
      summary: Update OCR settings
      description: |
        Runtime override of `OCR_MODE` / `SURYA_IDLE_TIMEOUT_MINUTES` (stored in
        Redis). Omitted fields are unchanged. Emits `surya_state_update`.
        Rate limit 30/minute.
      security:
        - AdminAuth: []
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: {type: string, enum: [cpu_only, on_demand]}
                idle_timeout_min: {type: integer, minimum: 1}
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrSettings'
        '400': {description: Body not a JSON object, invalid mode, or idle_timeout_min not an integer >= 1}
        '401': {description: Missing or malformed Authorization header}
        '403': {description: Invalid admin secret}
        '429': {description: Rate limit exceeded}
        '503': {description: Admin API disabled}
